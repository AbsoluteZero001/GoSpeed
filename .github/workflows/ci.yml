name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          # The root module has third-party dependencies (gorilla/websocket,
          # m-lab/ndt7-client-go), so go.sum exists and is tracked. Hashing
          # go.mod alone would not invalidate the cache when a dependency
          # version changes.
          cache-dependency-path: go.sum

      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      # Each job resolves its Go toolchain from its own module's go.mod, so a
      # module whose go directive is lower than the root module's makes that
      # job install an older toolchain and then fail with "module ../ requires
      # go >= X (running go Y; GOTOOLCHAIN=local)". Keep them in agreement.
      - name: Check module Go version agreement
        if: runner.os == 'Linux'
        run: |
          set -eu
          ref=$(awk '/^go /{print $2; exit}' go.mod)
          for m in desktop experiments/wan01a-poc experiments/mlab-poc; do
            got=$(awk '/^go /{print $2; exit}' "$m/go.mod")
            if [ "$got" != "$ref" ]; then
              echo "go directive mismatch: $m/go.mod declares $got, go.mod declares $ref" >&2
              exit 1
            fi
          done
          echo "all modules declare go $ref"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # Timing sensitive packages run repeatedly so a platform clock that
      # cannot resolve very short transfers shows up as a failure here instead
      # of as a flaky CI run later.
      #
      # netdiag measures TCP connect latency and gateway round trips, and
      # ndt7 derives its measurement window from SDK reported timestamps;
      # both assert on elapsed time and therefore belong in this net alongside
      # nodes and speedtest.
      - name: go test (repeat timing sensitive packages)
        run: go test -count=3 ./internal/nodes/ ./internal/speedtest/ ./internal/netdiag/ ./internal/provider/ndt7/

      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Build Linux amd64
        if: runner.os == 'Linux'
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o /tmp/gospeed-linux-amd64 ./cmd/gospeed

      - name: Build Windows amd64
        if: runner.os == 'Linux'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o /tmp/gospeed-windows-amd64.exe ./cmd/gospeed

      - name: Build native
        if: runner.os != 'Linux'
        run: go build ./cmd/gospeed

  desktop:
    name: Desktop GUI (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # The desktop client is a separate module and pins Wails v2, which
          # requires Go 1.25; the root module keeps its own go.mod.
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Test frontend (Vitest)
        working-directory: desktop/frontend
        run: npm test

      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build

      - name: go vet (desktop)
        working-directory: desktop
        run: go vet ./...

      - name: go test (desktop)
        working-directory: desktop
        run: go test ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build GoSpeed.exe
        working-directory: desktop
        run: wails build

  # WAN-01-B1: NDT7 Provider offline verification. This module is an
  # independent experiment with its own go.mod; the cache and tests are
  # scoped to that directory so they cannot pollute the root module.
  ndt7:
    name: NDT7 Provider PoC
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/wan01a-poc
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: experiments/wan01a-poc/go.mod
          cache: true
          cache-dependency-path: experiments/wan01a-poc/go.sum

      - name: go test (NDT7 PoC)
        run: go test ./...

      - name: go test -race (NDT7 PoC)
        run: go test -race ./...
