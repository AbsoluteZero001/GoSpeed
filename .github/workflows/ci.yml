name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          # The module has no third-party dependencies and therefore no go.sum;
          # hashing go.mod keeps the cache step from looking for a missing file.
          cache-dependency-path: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # Timing sensitive packages run repeatedly so a platform clock that
      # cannot resolve very short transfers shows up as a failure here instead
      # of as a flaky CI run later.
      - name: go test (repeat timing sensitive packages)
        run: go test -count=3 ./internal/nodes/ ./internal/speedtest/

      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Build Linux amd64
        if: runner.os == 'Linux'
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o /tmp/gospeed-linux-amd64 ./cmd/gospeed

      - name: Build Windows amd64
        if: runner.os == 'Linux'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o /tmp/gospeed-windows-amd64.exe ./cmd/gospeed

      - name: Build native
        if: runner.os != 'Linux'
        run: go build ./cmd/gospeed

  desktop:
    name: Desktop GUI (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # The desktop client is a separate module and pins Wails v2, which
          # requires Go 1.25; the root module keeps its own go.mod.
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Test frontend (Vitest)
        working-directory: desktop/frontend
        run: npm test

      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build

      - name: go vet (desktop)
        working-directory: desktop
        run: go vet ./...

      - name: go test (desktop)
        working-directory: desktop
        run: go test ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build GoSpeed.exe
        working-directory: desktop
        run: wails build
